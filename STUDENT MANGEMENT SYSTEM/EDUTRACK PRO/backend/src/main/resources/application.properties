# ===================================================================
# Spring Boot Application Properties - Student Management System
# ===================================================================

# Server Port
server.port=8080

# -------------------------------------------------------------------
# MySQL Database Configuration
# -------------------------------------------------------------------
# The database 'student_management' will be automatically created if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root

# >>> IMPORTANT: ENTER YOUR MYSQL ROOT PASSWORD HERE <<<
spring.datasource.password=YOUR_MYSQL_PASSWORD

# -------------------------------------------------------------------
# Hibernate / Spring Data JPA Configuration
# -------------------------------------------------------------------
# Automatically updates schema based on entity mappings
spring.jpa.hibernate.ddl-auto=update

# Show and format generated SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Database dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
